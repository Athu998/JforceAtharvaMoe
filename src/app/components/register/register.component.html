<h2>Register</h2>

<form (ngSubmit)="register()">

    <input
        type="text"
        name="name"
        [(ngModel)]="name"
        placeholder="Name"
        required
    >

    <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Register
    </button>

</form>

<p>{{ message }}</p>
